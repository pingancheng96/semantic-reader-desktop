[package]
name = "semantic-reader"
version = "0.20.21"
edition = "2021"

[build-dependencies]
tauri-build = "2.6.3"

[target.'cfg(windows)'.build-dependencies]
cc = "1.2"

[dependencies]
tauri = { version = "2.11.3", features = ["custom-protocol"] }
tauri-plugin-dialog = "2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dom_query = "0.27"
url = "2"
encoding_rs = "0.8"
base64 = "0.22"
flate2 = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "time", "sync", "fs", "io-util"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }

[profile.release]
strip = "symbols"

[dev-dependencies]
tauri = { version = "2.11.3", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
unicode-segmentation = "1.13.3"
